name = "kinsong-alive"
main = "src/index.ts"
compatibility_date = "2026-09-30"

[vars]
# Any Runware video model that takes a first and last frame.
VIDEO_MODEL = "bytedance:seedance@2.5"
VIDEO_RESOLUTION = "720p"

# Secrets (set with `wrangler secret put NAME`, or in .dev.vars for `wrangler dev`):
#   RUNWARE_API_KEY  your Runware key
#   APP_TOKEN        a long random string the app sends as a bearer token
